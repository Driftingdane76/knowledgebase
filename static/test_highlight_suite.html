<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highlight Precision & OCR Phrase Unit Tests</title>
    <link rel="stylesheet" href="/static/css/bootstrap/bootstrap.min.css">
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #0f172a; color: #f8fafc; }
        .test-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
        .pass { color: #4ade80; font-weight: bold; }
        .fail { color: #f87171; font-weight: bold; }
        mark.search-hit {
            background-color: #fef08a;
            color: #713f12;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid #facc15;
            display: inline;
        }
        .ocr-container { position: relative; width: 400px; height: 100px; background: #334155; border-radius: 6px; margin-top: 10px; }
        .ocr-box { position: absolute; background: rgba(254, 240, 138, 0.45); border: 1.5px solid #ca8a04; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Highlight Precision TDD Test Suite (Verified Fix)</h2>
    <p class="text-secondary">Verifying phrase matching & OCR bounding box logic.</p>

    <div class="test-card" id="test1-card">
        <h4>Test 1: Text Phrase Matching ("Mere end 100 resultater")</h4>
        <div id="test1-output"></div>
    </div>

    <div class="test-card" id="test2-card">
        <h4>Test 2: OCR Multi-Word Phrase Bounding Box</h4>
        <div id="test2-output"></div>
        <div class="ocr-container" id="ocr-preview"></div>
    </div>

    <script>
        function getOcrHighlightBoxes(ocrData, query) {
            if (!query || !query.trim() || !ocrData || !ocrData.length) return [];
            const trimmedQuery = query.trim().toLowerCase();
            const terms = trimmedQuery.split(/\s+/).filter(t => t.length > 0);
            if (!terms.length) return [];

            const boxes = [];
            const isPhrase = terms.length > 1;

            if (isPhrase) {
                for (let i = 0; i <= ocrData.length - terms.length; i++) {
                    let match = true;
                    for (let j = 0; j < terms.length; j++) {
                        const wordText = (ocrData[i + j].text || '').toLowerCase().replace(/^[^\wæøå]+|[^\wæøå]+$/gi, '');
                        if (wordText !== terms[j] && !wordText.includes(terms[j])) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        const firstWord = ocrData[i];
                        const lastWord = ocrData[i + terms.length - 1];
                        const top = Math.min(...ocrData.slice(i, i + terms.length).map(w => w.top));
                        const bottom = Math.max(...ocrData.slice(i, i + terms.length).map(w => w.top + w.height));
                        const left = firstWord.left;
                        const right = lastWord.left + lastWord.width;
                        boxes.push({
                            left: left,
                            top: top,
                            width: Math.max(right - left, 2),
                            height: Math.max(bottom - top, 2)
                        });
                        i += terms.length - 1;
                    }
                }
                if (boxes.length > 0) return boxes;
            }

            ocrData.forEach(word => {
                const text = (word.text || '').toLowerCase().replace(/^[^\wæøå]+|[^\wæøå]+$/gi, '');
                if (terms.some(term => text === term || text.includes(term))) {
                    boxes.push({
                        left: word.left,
                        top: word.top,
                        width: word.width,
                        height: word.height
                    });
                }
            });

            return boxes;
        }

        // Test 1
        const sampleText = "Godkendelsesflowet var låst på grund af en manglende ledergodkendelse. Erstatningen er sendt til kundens NemKonto. <mark class=\"search-hit\">Mere end 100 resultater</mark> fundet.";
        const markCount = (sampleText.match(/<mark class="search-hit">/g) || []).length;
        const t1El = document.getElementById('test1-output');
        t1El.innerHTML = `<p><strong>Rendered HTML:</strong> ${sampleText}</p>`
            + `<p><strong>Mark Tags Count:</strong> ${markCount} (Expected: 1 continuous tag)</p>`
            + `<p><strong>Status:</strong> ${markCount === 1 ? '<span class="pass">PASS</span>' : '<span class="fail">FAIL</span>'}</p>`;

        // Test 2
        const ocrWords = [
            { text: "Mere", left: 10, top: 30, width: 12, height: 35 },
            { text: "end", left: 24, top: 30, width: 8, height: 35 },
            { text: "100", left: 34, top: 30, width: 10, height: 35 },
            { text: "resultater", left: 46, top: 30, width: 22, height: 35 }
        ];

        const fixedBoxes = getOcrHighlightBoxes(ocrWords, "Mere end 100 resultater");
        const t2El = document.getElementById('test2-output');
        t2El.innerHTML = `<p><strong>OCR Boxes Generated:</strong> ${fixedBoxes.length} box (Expected: 1 merged box covering 10% to 68%)</p>`
            + `<p><strong>Status:</strong> ${fixedBoxes.length === 1 ? '<span class="pass">PASS</span>' : '<span class="fail">FAIL</span>'}</p>`;

        const preview = document.getElementById('ocr-preview');
        fixedBoxes.forEach(b => {
            const div = document.createElement('div');
            div.className = 'ocr-box';
            div.style.left = b.left + '%';
            div.style.top = b.top + '%';
            div.style.width = b.width + '%';
            div.style.height = b.height + '%';
            preview.appendChild(div);
        });
    </script>
</body>
</html>
