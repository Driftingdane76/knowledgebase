        // ==========================================
        // HIGHLIGHT & OCR LOGIC
        // ==========================================
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function highlightMatch(text, query) {
            if (!text) return '';
            const escapedText = escapeHTML(text);
            if (!query || !query.trim()) return escapedText;

            const trimmed = query.trim();
            const escapedPhrase = trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const words = trimmed.split(/\s+/).filter(t => t.length > 0).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));

            const pattern = escapedPhrase.includes(' ')
                ? `(?:\\b${escapedPhrase}\\b|${escapedPhrase}|(?:\\b(?:${words.join('|')})\\b))`
                : `(?:\\b${escapedPhrase}\\b|${escapedPhrase})`;

            return escapedText.replace(new RegExp(`(${pattern})(?![^<]*>)`, 'gi'), '<mark class="search-hit">$1</mark>');
        }

        function getOcrHighlightBoxes(ocrData, query) {
            if (!query || !query.trim() || !ocrData || !ocrData.length) return [];
            const trimmedQuery = query.trim().toLowerCase();
            const terms = trimmedQuery.split(/\s+/).filter(t => t.length > 0);
            if (!terms.length) return [];

            const boxes = [];
            const isPhrase = terms.length > 1;

            if (isPhrase) {
                for (let i = 0; i <= ocrData.length - terms.length; i++) {
                    let match = true;
                    for (let j = 0; j < terms.length; j++) {
                        const wordText = (ocrData[i + j].text || '').toLowerCase().replace(/^[^\wæøå]+|[^\wæøå]+$/gi, '');
                        if (wordText !== terms[j] && !wordText.includes(terms[j])) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        const firstWord = ocrData[i];
                        const lastWord = ocrData[i + terms.length - 1];
                        const top = Math.min(...ocrData.slice(i, i + terms.length).map(w => w.top));
                        const bottom = Math.max(...ocrData.slice(i, i + terms.length).map(w => w.top + w.height));
                        const left = firstWord.left;
                        const right = lastWord.left + lastWord.width;
                        boxes.push({
                            left: left,
                            top: top,
                            width: Math.max(right - left, 2),
                            height: Math.max(bottom - top, 2)
                        });
                        i += terms.length - 1;
                    }
                }
                if (boxes.length > 0) return boxes;
            }

            ocrData.forEach(word => {
                const text = (word.text || '').toLowerCase().replace(/^[^\wæøå]+|[^\wæøå]+$/gi, '');
                if (terms.some(term => text === term || text.includes(term))) {
                    boxes.push({
                        left: word.left,
                        top: word.top,
                        width: word.width,
                        height: word.height
                    });
                }
            });

            return boxes;
        }

        // ==========================================
        // RENDER ROWS (1:1 LIVE MIRROR)
        // ==========================================
        function renderRows() {
            const container = document.getElementById('kb-rows-container');
            const q = document.getElementById('test-search-input').value.trim();
            container.innerHTML = '';

            let totalMatches = 0;

            TEST_DATA.forEach(row => {
                const li = document.createElement('li');
                li.className = 'list-group-item p-0 bg-transparent';

                const thumbsHtml = (row.images || []).map(img => {
                    let hlBoxes = '';
                    if (q && img.ocrData && img.ocrData.length) {
                        getOcrHighlightBoxes(img.ocrData, q).forEach(b => {
                            totalMatches++;
                            hlBoxes += `<div class="ocr-highlight-box" style="left:${b.left}%;top:${b.top}%;width:${b.width}%;height:${b.height}%;"></div>`;
                        });
                    }
                    return `<div class="screenshot-container mb-2" onclick="zoomImage('${img.id}')">`
                        + `<img src="${img.dataUrl}" class="img-screenshot img-fluid" alt="${escapeHTML(img.name)}">`
                        + (hlBoxes ? `<div class="ocr-highlight-layer">${hlBoxes}</div>` : '')
                        + `</div>`;
                }).join('');

                const qHighlighted = highlightMatch(row.questionText, q);
                const rHighlighted = highlightMatch(row.resolutionText, q);
                const userHighlighted = highlightMatch(row.username, q);

                totalMatches += (qHighlighted.match(/<mark class="search-hit">/g) || []).length;
                totalMatches += (rHighlighted.match(/<mark class="search-hit">/g) || []).length;

                li.innerHTML = `
                    <div class="kb-row row g-0 m-0" id="${row.id}">
                        <div class="kb-cell col-12 col-md-1">
                            <div class="d-flex flex-column gap-2 w-100 align-items-start">
                                <span class="badge-date fw-semibold">${row.date}</span>
                                <span class="badge-user">@${userHighlighted}</span>
                            </div>
                        </div>
                        <div class="kb-cell col-12 col-md-5">
                            <div class="w-100">
                                <p class="mb-1 lh-base quest-text-render">${qHighlighted}</p>
                                ${thumbsHtml ? `<div class="d-flex flex-column gap-1 mt-2">${thumbsHtml}</div>` : ''}
                            </div>
                        </div>
                        <div class="kb-cell col-12 col-md-5">
                            <div class="resolution-container w-100">
                                <div class="w-100 font-mono lh-base resolution-text-render">${rHighlighted}</div>
                            </div>
                        </div>
                        <div class="kb-cell col-12 col-md-1">
                            <div class="d-flex flex-column gap-2 w-100 align-items-start">
                                <span class="badge-date fw-semibold">${row.date}</span>
                                <span class="badge-user">@DKquality</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(li);
            });

            document.getElementById('match-count').textContent = totalMatches;
            document.getElementById('search-status').textContent = q ? `Filtered by query "${q}"` : 'Showing all test cases';
        }

        // ==========================================
        // LIGHTBOX & HELPERS
        // ==========================================
        function zoomImage(imgId) {
            let img = null;
            for (let r of TEST_DATA) {
                img = (r.images || []).find(i => i.id === imgId);
                if (img) break;
            }
            if (!img) return;

            document.getElementById('overlay-img').src = img.dataUrl;
            document.getElementById('overlay-label').textContent = img.name;
            const container = document.getElementById('lightbox-highlight-container');
            container.innerHTML = '';

            const q = document.getElementById('test-search-input').value.trim();
            if (q && img.ocrData && img.ocrData.length) {
                getOcrHighlightBoxes(img.ocrData, q).forEach(b => {
                    const box = document.createElement('div');
                    box.className = 'ocr-highlight-box';
                    box.style.left = `${b.left}%`;
                    box.style.top = `${b.top}%`;
                    box.style.width = `${b.width}%`;
                    box.style.height = `${b.height}%`;
                    container.appendChild(box);
                });
            }

            document.getElementById('image-overlay').classList.add('show');
        }

        function closeOverlay() {
            document.getElementById('image-overlay').classList.remove('show');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            document.getElementById('themeBtn').innerHTML = next === 'dark' 
                ? '<i class="fa-solid fa-sun me-1"></i> Toggle Light/Dark Mode'
                : '<i class="fa-solid fa-moon me-1"></i> Toggle Light/Dark Mode';
        }

        function setQuery(q) {
            const input = document.getElementById('test-search-input');
            input.value = q;
            renderRows();
        }

        document.getElementById('test-search-input').addEventListener('input', renderRows);

        // Initial render
        renderRows();
    </script>
