<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test OCR Highlight Fix</title>
    <style>
        body { background: #1a1a1a; color: #fff; padding: 20px; font-family: sans-serif; }
        .image-container { position: relative; width: 800px; height: 200px; background: #2d3748; }
        .ocr-highlight-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            /* mix-blend-mode: multiply; REMOVED */
        }
        .search-hit {
            /* Fix for dark backgrounds */
            background-color: rgba(254, 240, 138, 0.4) !important;
            border: 2px solid rgba(254, 240, 138, 0.8);
            border-radius: 4px;
            color: transparent !important; /* Hide text if any */
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h2>Before (Gaps + Multiply)</h2>
    <div class="image-container" id="before">
        <!-- Old layer -->
        <div class="ocr-highlight-layer" style="mix-blend-mode: multiply;" id="before-layer"></div>
    </div>

    <h2>After (Merged Boxes + Alpha Background)</h2>
    <div class="image-container" id="after">
        <!-- New layer -->
        <div class="ocr-highlight-layer" id="after-layer"></div>
    </div>

    <script>
        const ocrData = [
            { text: "Mere", left: 10, top: 20, width: 8, height: 10 },
            { text: "end", left: 19, top: 20, width: 6, height: 10 },
            { text: "100", left: 26, top: 20, width: 7, height: 10 },
            { text: "resultater", left: 34, top: 20, width: 15, height: 10 },
            
            // Unrelated word
            { text: "noget", left: 10, top: 40, width: 10, height: 10 },
            
            // Wrap case
            { text: "Kunden", left: 70, top: 50, width: 10, height: 10 },
            { text: "har", left: 81, top: 50, width: 5, height: 10 },
            { text: "ingen", left: 87, top: 50, width: 8, height: 10 },
            { text: "inboforsikring", left: 10, top: 65, width: 20, height: 10 }
        ];

        const query1 = "Mere end 100 resultater";
        const query2 = "Kunden har ingen inboforsikring";

        // Old implementation
        function getCharWeight(ch) { return 0.55; }
        function calculateOffset(fullText, startIdx, matchLen) {
            return { leftRatio: 0, widthRatio: 1 }; // simplified for test
        }

        function getOcrHighlightBoxesOld(ocrData, query) {
            if (!query || !query.trim() || !ocrData) return [];
            const trimmed = query.trim().toLowerCase();
            const terms = trimmed.split(/\s+/).filter(t => t.length >= 2);
            const boxes = [];

            ocrData.forEach(item => {
                const raw = item.text || '';
                const lower = raw.toLowerCase();
                const targets = (trimmed.length > 2 && lower.includes(trimmed)) ? [trimmed] : terms;

                targets.forEach(target => {
                    let startIdx = 0;
                    while ((startIdx = lower.indexOf(target, startIdx)) !== -1) {
                        const endIdx = startIdx + target.length;
                        const { leftRatio, widthRatio } = calculateOffset(raw, startIdx, target.length);
                        const paddingPct = Math.min(item.width * 0.035, 1.8);
                        const calcLeft = item.left + (leftRatio * item.width);
                        const calcWidth = widthRatio * item.width;
                        const subLeft = Math.max(item.left, calcLeft - paddingPct);
                        const subWidth = Math.min(item.width, calcWidth + (2 * paddingPct));
                        boxes.push({
                            left: parseFloat(subLeft.toFixed(2)),
                            top: parseFloat((item.top - 0.3).toFixed(2)),
                            width: parseFloat(Math.max(subWidth, 2).toFixed(2)),
                            height: parseFloat((item.height + 0.6).toFixed(2))
                        });
                        startIdx = endIdx;
                    }
                });
            });
            return boxes;
        }

        // New Implementation
        function getOcrHighlightBoxesNew(ocrData, query) {
            if (!query || !query.trim() || !ocrData) return [];
            const trimmed = query.trim().toLowerCase();
            const terms = trimmed.split(/\s+/).filter(t => t.length >= 2);
            const rawBoxes = [];

            // 1. Gather all individual boxes
            ocrData.forEach(item => {
                const raw = item.text || '';
                const lower = raw.toLowerCase();
                const targets = (trimmed.length > 2 && lower.includes(trimmed)) ? [trimmed] : terms;

                targets.forEach(target => {
                    let startIdx = 0;
                    while ((startIdx = lower.indexOf(target, startIdx)) !== -1) {
                        const endIdx = startIdx + target.length;
                        const paddingPct = Math.min(item.width * 0.035, 1.8);
                        // Using full item width for simplified logic, or keep offset logic
                        rawBoxes.push({
                            left: item.left - paddingPct,
                            top: item.top - 0.5, // slightly more vertical padding
                            right: item.left + item.width + paddingPct,
                            bottom: item.top + item.height + 0.5,
                            height: item.height + 1.0,
                            top_orig: item.top
                        });
                        startIdx = endIdx;
                    }
                });
            });

            // 2. Merge overlapping or adjacent boxes on the same line
            if (rawBoxes.length === 0) return [];
            rawBoxes.sort((a, b) => (Math.abs(a.top_orig - b.top_orig) < 2 ? a.left - b.left : a.top_orig - b.top_orig));

            const mergedBoxes = [];
            let currentBox = rawBoxes[0];

            for (let i = 1; i < rawBoxes.length; i++) {
                const box = rawBoxes[i];
                // Check if on the same line (top diff is small) and adjacent (left is within threshold of current right)
                if (Math.abs(currentBox.top_orig - box.top_orig) < 2 && box.left - currentBox.right < 3) {
                    // Merge
                    currentBox.right = Math.max(currentBox.right, box.right);
                    currentBox.top = Math.min(currentBox.top, box.top);
                    currentBox.bottom = Math.max(currentBox.bottom, box.bottom);
                } else {
                    mergedBoxes.push(currentBox);
                    currentBox = box;
                }
            }
            mergedBoxes.push(currentBox);

            // Convert back to left/top/width/height format
            return mergedBoxes.map(b => ({
                left: parseFloat(b.left.toFixed(2)),
                top: parseFloat(b.top.toFixed(2)),
                width: parseFloat((b.right - b.left).toFixed(2)),
                height: parseFloat((b.bottom - b.top).toFixed(2))
            }));
        }

        function renderBoxes(containerId, boxes, oldStyle) {
            const container = document.getElementById(containerId);
            boxes.forEach(b => {
                const boxEl = document.createElement('div');
                boxEl.className = 'search-hit position-absolute';
                boxEl.style.left = b.left + '%';
                boxEl.style.top = b.top + '%';
                boxEl.style.width = b.width + '%';
                boxEl.style.height = b.height + '%';
                if (oldStyle) {
                    boxEl.style.backgroundColor = '#fef08a';
                }
                container.appendChild(boxEl);
            });
        }

        renderBoxes('before-layer', getOcrHighlightBoxesOld(ocrData, query1), true);
        renderBoxes('before-layer', getOcrHighlightBoxesOld(ocrData, query2), true);

        renderBoxes('after-layer', getOcrHighlightBoxesNew(ocrData, query1), false);
        renderBoxes('after-layer', getOcrHighlightBoxesNew(ocrData, query2), false);
    </script>
</body>
</html>
