        // ESCAPE HTML HELPER
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // TEXT HIGHLIGHT MATCH (EXACT LOGIC)
        function highlightMatch(text, query) {
            if (!text) return '';
            const escapedText = escapeHTML(text);
            if (!query || !query.trim()) return escapedText;

            const trimmed = query.trim();
            const escapedPhrase = trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const words = trimmed.split(/\s+/).filter(t => t.length > 0).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));

            const pattern = escapedPhrase.includes(' ')
                ? `(?:\\b${escapedPhrase}\\b|${escapedPhrase}|(?:\\b(?:${words.join('|')})\\b))`
                : `(?:\\b${escapedPhrase}\\b|${escapedPhrase})`;

            return escapedText.replace(new RegExp(`(${pattern})(?![^<]*>)`, 'gi'), '<mark class="search-hit">$1</mark>');
        }

        // OCR BOXES (EXACT UNIFIED PHRASE MERGING)
        function getOcrHighlightBoxes(ocrData, query) {
            if (!query || !query.trim() || !ocrData || !ocrData.length) return [];
            const trimmedQuery = query.trim().toLowerCase();
            const terms = trimmedQuery.split(/\s+/).filter(t => t.length > 0);
            if (!terms.length) return [];

            const boxes = [];

            // 1. If multi-word phrase query, look for matching word sequence to form a single continuous box
            if (terms.length > 1) {
                for (let i = 0; i <= ocrData.length - terms.length; i++) {
                    let match = true;
                    for (let j = 0; j < terms.length; j++) {
                        const wordText = (ocrData[i + j].text || '').toLowerCase().replace(/^[^\wæøå]+|[^\wæøå]+$/gi, '');
                        if (wordText !== terms[j] && !wordText.includes(terms[j])) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        const firstWord = ocrData[i];
                        const lastWord = ocrData[i + terms.length - 1];
                        const top = Math.min(...ocrData.slice(i, i + terms.length).map(w => w.top));
                        const bottom = Math.max(...ocrData.slice(i, i + terms.length).map(w => w.top + w.height));
                        const left = firstWord.left;
                        const right = lastWord.left + lastWord.width;
                        boxes.push({
                            left: Math.round(left * 100) / 100,
                            top: Math.round(top * 100) / 100,
                            width: Math.round(Math.max(right - left, 2) * 100) / 100,
                            height: Math.round(Math.max(bottom - top, 2) * 100) / 100
                        });
                        i += terms.length - 1;
                    }
                }
                if (boxes.length > 0) return boxes;
            }

            // 2. Sub-box slicing for words/phrases within multi-word OCR regions
            ocrData.forEach(item => {
                const rawText = item.text || '';
                const lowerText = rawText.toLowerCase();
                const totalLen = rawText.length || 1;

                terms.forEach(target => {
                    let startIdx = 0;
                    while ((startIdx = lowerText.indexOf(target, startIdx)) !== -1) {
                        const endIdx = startIdx + target.length;
                        const subLeft = item.left + (startIdx / totalLen) * item.width;
                        const subWidth = Math.max((target.length / totalLen) * item.width, 2);

                        boxes.push({
                            left: Math.round(subLeft * 100) / 100,
                            top: item.top,
                            width: Math.round(subWidth * 100) / 100,
                            height: item.height
                        });

                        startIdx = endIdx;
                    }
                });
            });

            return boxes;
        }

        // RENDER ROWS (EXACT PRODUCTION DOM GENERATION)
        function renderRows() {
            const list = document.getElementById('rows-list');
            const q = document.getElementById('search-input').value.trim();
            list.innerHTML = '';

            pages.forEach((page, index) => {
                const li = document.createElement('li');
                li.className = 'list-group-item p-0';
                li.id = 'row-item-' + page.id;

                let thumbsView = (page.images || []).map(img => {
                    let hlBoxes = '';
                    if (q && img.ocrData && img.ocrData.length) {
                        getOcrHighlightBoxes(img.ocrData, q).forEach(b => {
                            hlBoxes += '<div class="ocr-highlight-box" style="left:' + b.left + '%;top:' + b.top + '%;width:' + b.width + '%;height:' + b.height + '%;"></div>';
                        });
                    }
                    return '<div class="screenshot-container mb-2" onclick="event.stopPropagation()">'
                        + '<img src="' + img.dataUrl + '" class="img-screenshot img-fluid" onclick="zoomImage(\'' + img.id + '\')" title="' + escapeHTML(img.name) + '">'
                        + (hlBoxes ? '<div class="ocr-highlight-layer">' + hlBoxes + '</div>' : '')
                        + '</div>';
                }).join('');

                const qHighlighted = highlightMatch(page.question, q);
                const rHighlighted = highlightMatch(page.resolution, q);
                const userHighlighted = highlightMatch(page.user_display, q);

                li.innerHTML = '<div class="kb-row row g-0 m-0" id="row-' + page.id + '">'
                    + '<div class="kb-cell col-12 col-md-1">'
                    + '<div class="d-flex flex-column gap-2 w-100 align-items-start">'
                    + '<span class="badge-date fw-semibold">' + page.created_at_fmt + '</span>'
                    + '<span class="badge-user">@' + userHighlighted + '</span>'
                    + '</div>'
                    + '</div>'
                    + '<div class="kb-cell col-12 col-md-5">'
                    + '<div class="w-100">'
                    + '<p class="mb-1 lh-base quest-text-render">' + qHighlighted + '</p>'
                    + (thumbsView ? '<div class="d-flex flex-column gap-1 mt-2">' + thumbsView + '</div>' : '')
                    + '</div>'
                    + '</div>'
                    + '<div class="kb-cell col-12 col-md-5">'
                    + '<div class="resolution-container w-100">'
                    + '<div class="w-100 font-mono lh-base resolution-text-render">' + rHighlighted + '</div>'
                    + '</div>'
                    + '</div>'
                    + '<div class="kb-cell col-12 col-md-1">'
                    + '<div class="d-flex flex-column gap-2 w-100 align-items-start">'
                    + '<span class="badge-date fw-semibold">' + page.created_at_fmt + '</span>'
                    + '<span class="badge-user">@' + page.admin_user + '</span>'
                    + '</div>'
                    + '</div>'
                    + '</div>';

                list.appendChild(li);
            });
        }

        // LIGHTBOX ZOOM
        function zoomImage(imgId) {
            let foundImg = null;
            for (let p of pages) {
                foundImg = (p.images || []).find(i => i.id === imgId);
                if (foundImg) break;
            }
            if (!foundImg) return;

            document.getElementById('overlay-img').src = foundImg.dataUrl;
            document.getElementById('overlay-label').textContent = foundImg.name;
            const container = document.getElementById('lightbox-highlight-container');
            container.innerHTML = '';

            const q = document.getElementById('search-input').value.trim();
            if (q && foundImg.ocrData && foundImg.ocrData.length) {
                getOcrHighlightBoxes(foundImg.ocrData, q).forEach(b => {
                    const box = document.createElement('div');
                    box.className = 'ocr-highlight-box';
                    box.style.left = b.left + '%';
                    box.style.top = b.top + '%';
                    box.style.width = b.width + '%';
                    box.style.height = b.height + '%';
                    container.appendChild(box);
                });
            }

            document.getElementById('image-overlay').classList.add('show');
        }

        function closeOverlayFn() {
            document.getElementById('image-overlay').classList.remove('show');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const cur = html.getAttribute('data-bs-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            document.getElementById('theme-icon-sun').classList.toggle('d-none', next === 'light');
            document.getElementById('theme-icon-moon').classList.toggle('d-none', next === 'dark');
        }

        function setSearch(q) {
            document.getElementById('search-input').value = q;
            renderRows();
        }

        document.getElementById('search-input').addEventListener('input', renderRows);

        // Initial render
        renderRows();
