<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>TDD Test: Tag & Category Navigation Logic</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 24px; background: #f8fafc; color: #1e293b; }
        .test-card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
        .pass { color: #16a34a; font-weight: bold; }
        .fail { color: #dc2626; font-weight: bold; }
        pre { background: #0f172a; color: #f8fafc; padding: 12px; border-radius: 6px; font-size: 13px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; cursor: pointer; margin-right: 6px; }
        .bg-success-subtle { background: #dcfce7; color: #16a34a; }
        .bg-success { background: #16a34a; color: white; }
    </style>
</head>
<body>
    <h1>TDD Verification: Tag & Category Navigation</h1>
    <div id="results"></div>

    <script>
        const resultsEl = document.getElementById('results');
        function logResult(name, passed, detail) {
            const div = document.createElement('div');
            div.className = 'test-card';
            div.innerHTML = `
                <div><strong>${name}</strong>: <span class="${passed ? 'pass' : 'fail'}">${passed ? 'PASSED' : 'FAILED'}</span></div>
                <div style="font-size: 13px; color: #64748b; margin-top: 4px;">${detail}</div>
            `;
            resultsEl.appendChild(div);
        }

        // --- Mock State & Navigation Logic to Test ---
        let searchInputValue = "";
        let searchClearBtnVisible = false;
        let selectedCategoryId = null;
        let activeTrendingTags = [
            { name: "Mere end 100 resultater", count: 2 },
            { name: "Advarsel", count: 4 },
            { name: "Fejl", count: 7 }
        ];

        // The Proposed New Handlers
        function onTagClick(tagName) {
            const currentQ = searchInputValue.trim().toLowerCase();
            const targetQ = tagName.trim().toLowerCase();
            if (currentQ === targetQ) {
                // Toggle off
                searchInputValue = "";
            } else {
                // Switch to this tag cleanly (no appending!)
                searchInputValue = tagName;
                selectedCategoryId = null; // Reset category filter so tag search covers all questions
            }
            searchClearBtnVisible = searchInputValue.length > 0;
        }

        function onCategoryClick(catId) {
            // Auto-clear search when clicking a category
            searchInputValue = "";
            searchClearBtnVisible = false;
            selectedCategoryId = catId;
        }

        // --- Test Suite Execution ---

        // Test 1: Clicking Tag A sets search
        searchInputValue = "";
        onTagClick("Mere end 100 resultater");
        const t1_pass = (searchInputValue === "Mere end 100 resultater" && searchClearBtnVisible === true);
        logResult("Test 1: Click Tag A ('Mere end 100 resultater')", t1_pass, `Expected: 'Mere end 100 resultater', Actual: '${searchInputValue}'`);

        // Test 2: Clicking Tag B REPLACES Tag A (Does NOT append)
        onTagClick("Advarsel");
        const t2_pass = (searchInputValue === "Advarsel");
        logResult("Test 2: Click Tag B ('Advarsel') after Tag A", t2_pass, `Expected: 'Advarsel' (not concatenated), Actual: '${searchInputValue}'`);

        // Test 3: Clicking Tag B again TOGGLES OFF (Clears search)
        onTagClick("Advarsel");
        const t3_pass = (searchInputValue === "" && searchClearBtnVisible === false);
        logResult("Test 3: Click Tag B again to toggle off", t3_pass, `Expected: '' (empty search), Actual: '${searchInputValue}'`);

        // Test 4: Clicking a Category clears leftover search
        searchInputValue = "Kunden har fejl";
        searchClearBtnVisible = true;
        onCategoryClick("cat-policy-center");
        const t4_pass = (searchInputValue === "" && selectedCategoryId === "cat-policy-center" && searchClearBtnVisible === false);
        logResult("Test 4: Click Category with search input pre-filled", t4_pass, `Expected search: '', Category: 'cat-policy-center', Actual search: '${searchInputValue}', Cat: '${selectedCategoryId}'`);

        // Test 5: Old Buggy Logic Verification (Proving why old code failed)
        let oldSearchVal = "Mere end 100 resultater";
        function oldBuggyTagClick(tagName) {
            const currentQ = oldSearchVal.trim();
            if (!currentQ.includes(tagName)) {
                oldSearchVal = currentQ ? currentQ + ' ' + tagName : tagName;
            }
        }
        oldBuggyTagClick("Advarsel");
        const old_failed = (oldSearchVal === "Mere end 100 resultater Advarsel");
        logResult("Test 5: Proving Old Buggy Logic (Concatenation Failure)", old_failed, `Old code produced: '${oldSearchVal}' which resulted in 0 search matches.`);
    </script>
</body>
</html>
