name: Build and deploy Python app to Azure Web App - kb-app-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-kb-app-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies in GitHub Runner (16GB RAM)
        run: |
          pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Create Clean Deployment Archive
        run: |
          zip -r deploy.zip . -x "*.git*" "*.github*" "*.venv*" "*venv*" "*antenv*" "*__pycache__*" "*.sqlite3*" "*.env*" "*test_output_images*" "*test_htmls*" ".agents*" "AGENTS.md" ".cursorrules"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'kb-app-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
          clean: true