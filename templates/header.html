{% load i18n static %}
    <!-- NAVBAR -->
    <nav class="app-navbar">
        <div class="container-xl px-4 navbar-inner">
            <a href="{% url 'index' %}" class="d-flex align-items-center gap-2 text-decoration-none text-body">
                <div class="p-2 rounded-3 brand-icon">
                    <i class="fa-solid fa-circle-question fa-lg"></i>
                </div>
                <div>
                    <h1 class="mb-0 fw-bold app-title">Q&A <span class="d-none d-sm-inline"><span
                                class="text-secondary fw-normal mx-1 position-relative app-title-separator">|</span> {% translate "Knowledge" %}</span></h1>

                </div>
            </a>
            <div class="d-flex align-items-center gap-2">
                <div class="d-flex align-items-center gap-2 me-2">

                    <button class="btn btn-link p-0 text-secondary text-decoration-none" data-bs-toggle="tooltip"
                        data-bs-html="true" data-bs-placement="bottom"
                        title="&lt;div class=&quot;p-1 text-start tooltip-shortcuts-wrap&quot;&gt;&lt;strong class=&quot;d-block mb-2 text-primary-subtle border-bottom pb-1&quot;&gt;&lt;i class=&quot;fa-solid fa-keyboard me-1&quot;&gt;&lt;/i&gt; {% translate 'Controls &amp; Shortcuts' %}&lt;/strong&gt;&lt;div class=&quot;mb-1 text-secondary fw-bold text-uppercase tooltip-section-title&quot;&gt;{% translate 'Editing' %}&lt;/div&gt;&lt;ul class=&quot;list-unstyled mb-2 d-flex flex-column gap-1&quot;&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-mouse-pointer text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Click any cell to edit inline' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-check text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Press &lt;kbd&gt;Enter&lt;/kbd&gt; to save fields' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-xmark text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Press &lt;kbd&gt;Esc&lt;/kbd&gt; to discard' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-cloud-arrow-up text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Click outside to autosave' %}&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;mb-1 text-secondary fw-bold mt-2 text-uppercase tooltip-section-title&quot;&gt;{% translate 'Search &amp; Highlight' %}&lt;/div&gt;&lt;ul class=&quot;list-unstyled mb-2 d-flex flex-column gap-1&quot;&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-magnifying-glass text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Paste text anywhere to auto-search' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-highlighter text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Select text &amp; pick color to highlight' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-eraser text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Eraser swatch clears highlights' %}&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;mb-1 text-secondary fw-bold mt-2 text-uppercase tooltip-section-title&quot;&gt;{% translate 'Lightbox Editor' %}&lt;/div&gt;&lt;ul class=&quot;list-unstyled mb-0 d-flex flex-column gap-1&quot;&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-pencil text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Press &lt;kbd&gt;1&lt;/kbd&gt;, &lt;kbd&gt;2&lt;/kbd&gt;, &lt;kbd&gt;3&lt;/kbd&gt; for pens' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-hand text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate '&lt;kbd&gt;Space&lt;/kbd&gt; + drag to pan' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-regular fa-copy text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Press &lt;kbd&gt;S&lt;/kbd&gt; to save, &lt;kbd&gt;C&lt;/kbd&gt; to copy' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-magnifying-glass-plus text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Scroll or &lt;kbd&gt;Ctrl&lt;/kbd&gt; &lt;kbd&gt;+&lt;/kbd&gt;&lt;kbd&gt;-&lt;/kbd&gt; to zoom' %}&lt;/span&gt;&lt;/li&gt;&lt;li class=&quot;d-flex align-items-start gap-2&quot;&gt;&lt;i class=&quot;fa-solid fa-rotate-left text-primary-subtle mt-1 tooltip-icon-fixed&quot;&gt;&lt;/i&gt;&lt;span&gt;{% translate 'Undo (Ctrl+Z)' %}&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;">
                        <i class="fa-solid fa-circle-info text-secondary hover-primary info-icon"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary flex-shrink-0 px-2 ms-2 hide-on-print"
                        onclick="window.print()" title="{% translate 'Print to PDF' %}">
                        <i class="fa-solid fa-print"></i>
                    </button>
                </div>
                <div class="vr d-none d-sm-block"></div>

                <!-- Language Switcher -->
                <form action="{% url 'set_language' %}" method="post" class="mb-0 me-1">
                    {% csrf_token %}
                    <input name="next" type="hidden" value="{{ request.get_full_path }}">
                    <div class="dropdown">
                        {% get_current_language as LANGUAGE_CODE %}
                        <button
                            class="btn btn-sm text-secondary fw-bold dropdown-toggle d-flex align-items-center gap-1 border-0 shadow-none px-2"
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {% if LANGUAGE_CODE == 'da' %}🇩🇰 DA{% else %}🇬🇧 EN{% endif %}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 py-1 lang-dropdown-menu">
                            <li>
                                <button type="submit" name="language" value="da"
                                    class="dropdown-item d-flex align-items-center gap-2 py-2 {% if LANGUAGE_CODE == 'da' %}active fw-bold{% endif %}">
                                    🇩🇰 DA
                                </button>
                            </li>
                            <li>
                                <button type="submit" name="language" value="en"
                                    class="dropdown-item d-flex align-items-center gap-2 py-2 {% if LANGUAGE_CODE == 'en' %}active fw-bold{% endif %}">
                                    🇬🇧 EN
                                </button>
                            </li>
                        </ul>
                    </div>
                </form>

                <div class="vr d-none d-sm-block"></div>
                <button id="theme-toggle" class="action-btn" title="{% translate 'Toggle Theme' %}">
                    <i class="fa-regular fa-sun icon-amber" id="theme-icon-sun"></i>
                    <i class="fa-regular fa-moon d-none icon-indigo" id="theme-icon-moon"></i>
                </button>
                <a href="/" class="action-btn text-decoration-none" title="{% translate 'Reload' %}">
                    <i class="fa-solid fa-rotate-right icon-emerald"></i>
                </a>
            </div>
        </div>
    </nav>
