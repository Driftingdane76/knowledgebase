{% load i18n %}
        <!-- Sidebar Column -->
        <aside class="sidebar-aside p-3">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-body sidebar-card">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="fw-bold mb-0 d-flex align-items-center gap-2 sidebar-card-title">
                        <i class="fa-solid fa-folder text-primary-subtle"></i> {% translate "Categories" %}
                    </h5>
                </div>
                <div class="card-body p-2">
                    <!-- Category Search -->
                    <div class="search-wrap mb-2 px-2">
                        <span class="search-icon"><i class="fa-solid fa-magnifying-glass fa-xs"></i></span>
                        <input type="text" id="category-search-input"
                            class="form-control form-control-sm cat-search-input"
                            placeholder="{% translate 'Filter categories...' %}">
                    </div>
                    <!-- Categories List -->
                    <ul class="nav flex-column gap-1" id="categories-list">
                        <!-- Rendered dynamically -->
                    </ul>

                    <!-- Add Category Form -->
                    <div class="p-2 border-top mt-2 sidebar-add-border">
                        <div class="input-group input-group-sm">
                            <input type="text" id="new-category-input" class="form-control cat-add-input"
                                placeholder="{% translate 'New category...' %}">
                            <button id="add-category-btn" class="btn btn-primary cat-add-btn"><i
                                    class="fa-solid fa-plus fa-xs"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-body sidebar-card mt-3">
                <div class="card-header bg-transparent border-bottom p-3">
                    <h5 class="fw-bold mb-0 d-flex align-items-center gap-2 sidebar-card-title">
                        <i class="fa-solid fa-fire icon-amber"></i> {% translate "Tags" %}
                    </h5>
                </div>
                <div class="card-body p-3">
                    <div id="trending-tags-container" class="d-flex flex-wrap gap-1">
                        <!-- Rendered dynamically -->
                        <span class="text-secondary text-xs">{% translate "Loading tags..." %}</span>
                    </div>
                </div>
            </div>

        </aside>
