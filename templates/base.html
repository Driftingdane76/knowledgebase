{% load static i18n %}
<!DOCTYPE html>
<html lang="da" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A production-ready Q&A Knowledgebase with inline editing, image attachments, and full-text search.">
    <title>Q&A | Knowledge</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">

    <!-- Font Awesome 6 Free -->
    <link rel="stylesheet" href="{% static 'css/fontawesome/all.min.css' %}">

    <!-- App Styles -->
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=1.20">

    <!-- Django JavaScript Translations Catalog -->
    <script src="{% url 'javascript-catalog' %}"></script>
    <script src="{% static 'js/pagination.js' %}"></script>
</head>

<body>

    {% include 'header.html' %}
    {% block content %}
    {% endblock %}
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="{% static 'js/bootstrap/bootstrap.bundle.min.js' %}"></script>

    <script>
        const userCanEdit = {% if can_edit %}true{% else %}false{% endif %};
        const userIsSuperuser = {% if is_superuser %}true{% else %}false{% endif %};

    </script>
    <script src="{% static 'js/app.js' %}?v=1.7"></script>
</body>

</html>
